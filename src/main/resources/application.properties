# PostgreSQLの接続情報
spring.datasource.url=jdbc:postgresql://localhost:5432/english_vocab
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# テーブルを自動作成・更新する設定（開発時のみ update にします）
spring.jpa.hibernate.ddl-auto=update

# 実行されたSQLをコンソールに表示する設定
spring.jpa.show-sql=true

spring.security.user.name=NovelHighLight
spring.security.user.password=RuningWithMe
