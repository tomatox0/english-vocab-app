<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>テスト実行中</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">
    <div class="container py-5" style="max-width: 600px;">

        <!-- テスト実行中のエリア -->
        <div id="test-area" class="card shadow-sm border-dark-subtle text-center">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="card-title mb-0" id="question-counter">第 1 問 / 全 <span th:text="${limit}"></span> 問</h5>
            </div>
            <div class="card-body py-5">
                <!-- JavaScriptで問題の指示を切り替えるために id を追加 -->
                <p class="text-secondary fw-bold mb-2" id="question-instruction">読み込み中...</p>
                <h2 class="display-5 fw-bold mb-5" id="question-text">読み込み中...</h2>

                <div class="mb-4 px-4">
                    <input type="text" id="answer-input"
                        class="form-control form-control-lg text-center border-dark-subtle" placeholder="回答を入力"
                        autocomplete="off" autofocus>
                </div>

                <button id="next-btn" class="btn btn-dark btn-lg px-5" onclick="checkAnswer()">回答する</button>
            </div>
        </div>

        <!-- テスト結果表示エリア -->
        <div id="result-area" class="d-none">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body py-5 text-center">
                    <h2 class="fw-bold mb-3">テスト結果</h2>
                    <h1 class="display-4 fw-bold mb-0 text-dark">正解数：<span id="score-display">0</span> / <span
                            th:text="${limit}"></span></h1>
                </div>
            </div>

            <h4 class="fw-bold mb-3">詳細</h4>
            <div class="list-group shadow-sm" id="result-list">
                <!-- ここに結果一覧がJavaScriptで追加されます -->
            </div>

            <div class="d-grid mt-4 gap-2">
                <a th:href="@{/test}" class="btn btn-dark btn-lg">もう一度テストする</a>
                <a th:href="@{/register}" class="btn btn-outline-secondary">単語管理へ戻る</a>
            </div>
        </div>

    </div>

    <script th:inline="javascript">
        const words = /*[[${testWords}]]*/[];
        const totalQuestions = words.length;

        let currentIndex = 0;
        let correctCount = 0;
        let results = [];
        let currentMode = ""; // 現在の問題が「jpToEn」か「enToJp」かを記憶する変数

        if (totalQuestions > 0) {
            showQuestion();
        }

        function showQuestion() {
            document.getElementById("question-counter").innerText = `第 ${currentIndex + 1} 問 / 全 ${totalQuestions} 問`;

            // 0.5を境にしてランダムにモードを決定（50%の確率）
            if (Math.random() < 0.5) {
                currentMode = "jpToEn";
                document.getElementById("question-instruction").innerText = "この単語を英語にしてください";
                document.getElementById("question-text").innerText = words[currentIndex].jpMeaning;
            } else {
                currentMode = "enToJp";
                document.getElementById("question-instruction").innerText = "この単語を日本語にしてください";
                document.getElementById("question-text").innerText = words[currentIndex].enWord;
            }

            document.getElementById("answer-input").value = "";
            document.getElementById("answer-input").focus();
        }

        function checkAnswer() {
            // 入力された文字の前後空白を消し、小文字に揃える
            const userInput = document.getElementById("answer-input").value.trim().toLowerCase();

            let correctAnswer = "";
            let questionText = "";

            // 現在の出題モードに合わせて正解をセット
            if (currentMode === "jpToEn") {
                correctAnswer = words[currentIndex].enWord.toLowerCase();
                questionText = words[currentIndex].jpMeaning;
            } else {
                correctAnswer = words[currentIndex].jpMeaning.toLowerCase();
                questionText = words[currentIndex].enWord;
            }

            // 正誤判定
            const isCorrect = (userInput === correctAnswer);
            if (isCorrect) {
                correctCount++;
            }

            // 結果の保存
            results.push({
                question: questionText,
                correctAnswer: words[currentIndex].enWord === correctAnswer ? words[currentIndex].enWord : words[currentIndex].jpMeaning, // 元の大文字小文字を維持するため
                userAnswer: document.getElementById("answer-input").value.trim(), // 入力したそのままの文字
                isCorrect: isCorrect
            });

            currentIndex++;

            if (currentIndex < totalQuestions) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("test-area").classList.add("d-none");
            document.getElementById("result-area").classList.remove("d-none");

            document.getElementById("score-display").innerText = correctCount;

            const resultList = document.getElementById("result-list");
            results.forEach((res, index) => {
                const colorClass = res.isCorrect ? "text-success" : "text-danger";
                const mark = res.isCorrect ? "〇" : "×";

                const item = document.createElement("div");
                item.className = "list-group-item py-3";
                item.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="fw-bold">Q${index + 1}. ${res.question}</span>
                        <span class="fw-bold fs-5 ${colorClass}">${mark}</span>
                    </div>
                    <div class="small">
                        正解: <span class="fw-bold">${res.correctAnswer}</span><br>
                        あなたの回答: <span class="${colorClass}">${res.userAnswer || '(無回答)'}</span>
                    </div>
                `;
                resultList.appendChild(item);
            });
        }

        document.getElementById("answer-input").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkAnswer();
            }
        });
    </script>
</body>

</html>
