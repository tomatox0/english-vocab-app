<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>単語の登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">
    <div class="container py-4" style="max-width: 800px;">
        <h1 class="mb-4 text-conter fw-bold">単語管理</h1>

        <div class="card shadow-sm mb-5 border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="card-title mb-0">新しい単語を登録</h5>
            </div>

            <div class="card-body bg-white border border-top-0">
                <form th:action="@{/register}" th:object="${word}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">英単語</label>
                            <input type="text" class="form-control border-dark-subtle" th:field="*{enWord}" required
                                placeholder="例: apple">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">日本語訳</label>
                            <input type="text" class="form-control border-dark-subtle" th:field="*{jpMeaning}" required
                                placeholder="例: りんご">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">例文・解説</label>
                        <textarea class="form-control border-dark-subtle" th:field="*{exampleSentence}" row="3"
                            placeholder="例: I ate an apple."></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark btn-lg">登録する</button>
                        <a th:href="@{/study}" class="btn btn-outline-secondary">学習モードへ</a>
                        <a th:href="@{/test}" class="btn btn-outline-primary">テストモードへ</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white py-3">
                <h5 class="card-title mb-0">登録済みの単語一覧</h5>
            </div>

            <div class="card-body p-0 border border-top-0 bg-white">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>英単語</th>
                                <th>日本語訳</th>
                                <th>例文・解説</th>
                                <th class="text-center">操作</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(wordList)}">
                                <td colspan="4" class="text-center text-secondary py-4">まだ単語が登録されていません</td>
                            </tr>

                            <tr th:each="w : ${wordList}">
                                <td class="fw-bold" th:text="${w.enWord}"></td>
                                <td th:text="${w.jpMeaning}"></td>
                                <td style="white-space: pre-wrap; font-size: 0.9em; color: #6c757d;"
                                    th:text="${w.exampleSentence}"></td>
                                <td class="text-center">
                                    <form th:action="@{/delete/{id}(id=${w.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-dark"
                                            onclick="return confirm('本当に削除しますか？');">削除</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
