<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>単語学習</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">
    <div class="container py-5" style="max-width: 600px;">
        <h1 class="mb-4 text-center fw-bold text-dark">学習モード</h1>

        <div class="d-flex justify-content-center mb-4">
            <div class="btn-group shadow-sm" role="group">
                <a th:href="@{/study(mode='enToJp')}" class="btn"
                    th:classappend="${#strings.equals(mode, 'enToJp')} ? 'btn-dark' : 'btn-outline-dark'">英 → 日</a>
                <a th:href="@{/study(mode='jpToEn')}" class="btn"
                    th:classappend="${#strings.equals(mode, 'jpToEn')} ? 'btn-dark' : 'btn-outline-dark'">日 → 英</a>
            </div>
        </div>

        <div th:if="${word == null}" class="alert alert-secondary text-center shadow-sm">
            <p class="mb-3">単語がまだ登録されていません。</p>
            <a th:href="@{/register}" class="btn btn-dark">単語を登録する</a>
        </div>

        <div th:if="${word != null}">
            <div class="card shadow-sm mb-4 text-center border-dark-subtle">
                <div class="card-body py-5">
                    <p class="text-secondary fw-bold mb-2">Q. 問題</p>
                    <h2 class="display-5 fw-bold mb-4" th:if="${#strings.equals(mode, 'enToJp')}"
                        th:text="${word.enWord}"></h2>
                    <h2 class="display-5 fw-bold mb-4" th:if="${#strings.equals(mode, 'jpToEn')}"
                        th:text="${word.jpMeaning}"></h2>

                    <button id="show-answer-btn" class="btn btn-dark btn-lg px-5 rounded-pill shadow-sm"
                        onclick="showAnswer()">正解を見る</button>

                    <div id="answer-section" class="d-none mt-4">
                        <hr class="mb-4 border-dark-subtle">
                        <p class="text-secondary fw-bold mb-2">A. 正解</p>
                        <h2 class="fw-bold mb-4 text-dark" th:if="${#strings.equals(mode, 'enToJp')}"
                            th:text="${word.jpMeaning}"></h2>
                        <h2 class="fw-bold mb-4 text-dark" th:if="${#strings.equals(mode, 'jpToEn')}"
                            th:text="${word.enWord}"></h2>

                        <div class="bg-light p-3 rounded text-start mt-3 border border-dark-subtle"
                            th:if="${not #strings.isEmpty(word.exampleSentence)}">
                            <span class="badge bg-dark mb-2">例文・解説</span>
                            <p class="mb-0 text-dark" style="white-space: pre-wrap;" th:text="${word.exampleSentence}">
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <a th:href="@{/study(mode=${mode})}" class="btn btn-dark btn-lg shadow-sm">次の問題へ</a>
                <a th:href="@{/register}" class="btn btn-outline-secondary mt-2">単語管理画面へ</a>
                <a th:href="@{/test}" class="btn btn-outline-primary mt-2">テストモードへ</a>
            </div>
        </div>
    </div>

    <script>
        function showAnswer() {
            document.getElementById('answer-section').classList.remove('d-none');
            document.getElementById('show-answer-btn').classList.add('d-none');
        }
    </script>
</body>

</html>
